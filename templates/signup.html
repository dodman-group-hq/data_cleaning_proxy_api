<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dodman · Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      background: #07070a; color: #d0d0e0;
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 44px 44px;
    }
    .card {
      background: #0f0f12; border: 1px solid #232329; border-radius: 16px;
      width: 100%; max-width: 420px; padding: 40px;
      position: relative; z-index: 1;
      box-shadow: 0 0 60px rgba(16,185,129,.04), 0 0 0 1px #ffffff05;
      animation: fadein .3s ease;
    }
    .field-input {
      width: 100%; background: #07070a; border: 1px solid #232329;
      border-radius: 6px; padding: 10px 14px;
      font-family: 'IBM Plex Mono', monospace; font-size: 13px;
      color: #d0d0e0; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .field-input:focus { border-color: #10b981; box-shadow: 0 0 0 1px #10b98144; }
    .field-input::placeholder { color: #3a3a44; }
    .btn-primary {
      width: 100%; background: #10b981; color: #07070a;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px;
      letter-spacing: .08em; text-transform: uppercase;
      border: none; border-radius: 6px; padding: 11px;
      cursor: pointer; transition: background .15s;
    }
    .btn-primary:hover { background: #34d399; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    label { display: block; font-size: 11px; color: #6b6b7a; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
    .error-box { background: rgba(244,63,94,.08); border: 1px solid rgba(244,63,94,.3); border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #fb7185; }
    .success-box { background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.3); border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #34d399; }
    a { color: #10b981; text-decoration: none; }
    a:hover { color: #6ee7b7; }
    @keyframes fadein { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
<div class="card">
  <div class="mb-8 text-center space-y-1">
    <p style="font-family:Syne,sans-serif;font-weight:700;font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:#10b981;">DODMAN GROUP</p>
    <h1 style="font-family:Syne,sans-serif;font-weight:800;font-size:24px;color:white;letter-spacing:-.02em;">Create account</h1>
    <p style="font-size:11px;color:#6b6b7a;margin-top:4px;">Get API access to the Data Cleaning Proxy</p>
  </div>

  <form id="signup-form" class="space-y-4" onsubmit="handleSignup(event)">
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email"
        placeholder="you@company.com" class="field-input" />
    </div>
    <div>
      <label for="password">Password <span style="color:#3a3a44;font-size:10px;text-transform:none;letter-spacing:0;">(min. 8 characters)</span></label>
      <input id="password" name="password" type="password" required autocomplete="new-password"
        placeholder="••••••••" class="field-input" />
    </div>
    <div>
      <label for="confirm">Confirm Password</label>
      <input id="confirm" name="confirm" type="password" required autocomplete="new-password"
        placeholder="••••••••" class="field-input" />
    </div>

    <div id="form-error"   class="error-box   hidden"></div>
    <div id="form-success" class="success-box hidden"></div>

    <button id="submit-btn" type="submit" class="btn-primary mt-2">Create account</button>
  </form>

  <p style="text-align:center;font-size:11px;color:#6b6b7a;margin-top:24px;">
    Already have an account? <a href="/auth/login-page">Sign in</a>
  </p>
</div>

<script>
async function handleSignup(e) {
  e.preventDefault();
  const btn      = document.getElementById('submit-btn');
  const errBox   = document.getElementById('form-error');
  const okBox    = document.getElementById('form-success');
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;

  errBox.classList.add('hidden');
  okBox.classList.add('hidden');

  if (password !== confirm) {
    errBox.textContent = 'Passwords do not match.';
    errBox.classList.remove('hidden');
    return;
  }
  if (password.length < 8) {
    errBox.textContent = 'Password must be at least 8 characters.';
    errBox.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating account…';

  try {
    const res  = await fetch('/auth/signup', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email, password }),
    });
    const data = await res.json();

    if (res.ok) {
      okBox.textContent = 'Account created! Redirecting to sign in…';
      okBox.classList.remove('hidden');
      setTimeout(() => window.location.href = '/auth/login-page', 1800);
    } else {
      errBox.textContent = data?.error?.message ?? `Error ${res.status}`;
      errBox.classList.remove('hidden');
    }
  } catch (err) {
    errBox.textContent = `Network error: ${err.message}`;
    errBox.classList.remove('hidden');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Create account';
  }
}
</script>
</body>
</html>
