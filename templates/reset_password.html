<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07070a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2307070a'/%3E%3Cpath d='M7 12l3.2 3.2L17 8' stroke='%23f59e0b' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>Dodman · Set New Password</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Set a new password for your Vett account.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dodman Group">
  <meta property="og:title" content="Vett · Set New Password">
  <meta property="og:description" content="Set a new password for your Vett account.">
  <meta property="og:url" content="https://prod-vett.onrender.com/auth/reset-password-page">
  <meta name="twitter:title" content="Vett · Set New Password">
  <meta name="twitter:description" content="Set a new password for your Vett account.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      background: #07070a;
      color: #d0d0e0;
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 44px 44px;
    }
    .card {
      background: #0f0f12;
      border: 1px solid #232329;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 40px;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 60px rgba(245,158,11,0.04), 0 0 0 1px #ffffff05;
      animation: fadein .3s ease;
    }
    .field-input {
      width: 100%;
      background: #07070a;
      border: 1px solid #232329;
      border-radius: 6px;
      padding: 10px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #d0d0e0;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field-input:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 1px #f59e0b44;
    }
    .field-input::placeholder { color: #3a3a44; }
    .field-input:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary {
      width: 100%;
      background: #f59e0b;
      color: #07070a;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      padding: 11px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-primary:hover { background: #fbbf24; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    label { display: block; font-size: 11px; color: #6b6b7a; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
    .error-box {
      background: rgba(244,63,94,.08);
      border: 1px solid rgba(244,63,94,.3);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      color: #fb7185;
    }
    .success-box {
      background: rgba(16,185,129,.08);
      border: 1px solid rgba(16,185,129,.3);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      color: #34d399;
    }
    .strength-bar {
      height: 3px;
      border-radius: 2px;
      margin-top: 8px;
      transition: width .2s, background .2s;
      width: 0%;
      background: #232329;
    }
    .strength-label {
      font-size: 10px;
      color: #6b6b7a;
      margin-top: 4px;
      min-height: 14px;
    }
    a { color: #f59e0b; text-decoration: none; }
    a:hover { color: #fcd34d; }
    @keyframes fadein { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
<div class="card">
  <!-- Logo -->
  <div class="mb-8 text-center space-y-1">
    <p style="font-family:Syne,sans-serif;font-weight:700;font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:#f59e0b;">DODMAN GROUP</p>
    <h1 style="font-family:Syne,sans-serif;font-weight:800;font-size:24px;color:white;letter-spacing:-.02em;">Set new password</h1>
    <p style="font-size:11px;color:#6b6b7a;margin-top:4px;">Data Cleaning Proxy · Client Dashboard</p>
  </div>

  <!-- Token error state — rendered server-side by Jinja if token is invalid/expired -->
  {% if error %}
  <div class="error-box mb-5">{{ error }}</div>
  <p style="text-align:center;font-size:11px;color:#6b6b7a;margin-top:20px;">
    <a href="/auth/forgot-password-page">Request a new reset link</a>
  </p>

  {% else %}

  <!-- Success state (shown after password is updated) -->
  <div id="success-state" class="hidden">
    <div class="success-box" style="text-align:center;padding:20px 14px;">
      <div style="font-size:24px;margin-bottom:8px;">✅</div>
      <p style="color:#34d399;font-size:13px;font-weight:600;margin-bottom:6px;">Password updated</p>
      <p style="color:#6b6b7a;font-size:11px;line-height:1.6;">
        Your password has been changed. Redirecting you to sign in…
      </p>
    </div>
  </div>

  <!-- Reset form -->
  <div id="form-state">
    <form id="reset-form" class="space-y-4" onsubmit="handleReset(event)">

      <div>
        <label for="password">New password <span style="color:#3a3a44;font-size:10px;text-transform:none;letter-spacing:0;">(min. 8 characters)</span></label>
        <input id="password" name="password" type="password" required autocomplete="new-password"
          placeholder="••••••••" class="field-input" oninput="checkStrength(this.value)" />
        <div class="strength-bar" id="strength-bar"></div>
        <p class="strength-label" id="strength-label"></p>
      </div>

      <div>
        <label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" required autocomplete="new-password"
          placeholder="••••••••" class="field-input" />
      </div>

      <div id="form-error" class="error-box hidden"></div>

      <button id="submit-btn" type="submit" class="btn-primary mt-2">Update password</button>
    </form>
  </div>

  {% endif %}

  <p style="text-align:center;font-size:11px;color:#6b6b7a;margin-top:24px;">
    <a href="/auth/login-page">Back to sign in</a>
  </p>
</div>

<script>
  // Pull token from URL — passed by the backend via Jinja context,
  // but we also read it from the URL as a fallback.
  const TOKEN = "{{ token or '' }}" || new URLSearchParams(window.location.search).get('token') || '';

  // ── Password strength indicator ──────────────────────────────────────────
  function checkStrength(val) {
    const bar   = document.getElementById('strength-bar');
    const label = document.getElementById('strength-label');
    if (!val) { bar.style.width = '0%'; label.textContent = ''; return; }

    let score = 0;
    if (val.length >= 8)  score++;
    if (val.length >= 12) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
      { pct: '20%', color: '#ef4444', text: 'Weak' },
      { pct: '40%', color: '#f97316', text: 'Fair' },
      { pct: '60%', color: '#eab308', text: 'Good' },
      { pct: '80%', color: '#84cc16', text: 'Strong' },
      { pct: '100%', color: '#10b981', text: 'Very strong' },
    ];
    const lvl = levels[Math.min(score - 1, 4)] || levels[0];
    bar.style.width      = lvl.pct;
    bar.style.background = lvl.color;
    label.style.color    = lvl.color;
    label.textContent    = lvl.text;
  }

  // ── Submit handler ───────────────────────────────────────────────────────
  async function handleReset(e) {
    e.preventDefault();
    const btn      = document.getElementById('submit-btn');
    const errBox   = document.getElementById('form-error');
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    errBox.classList.add('hidden');

    if (password !== confirm) {
      errBox.textContent = 'Passwords do not match.';
      errBox.classList.remove('hidden');
      return;
    }
    if (password.length < 8) {
      errBox.textContent = 'Password must be at least 8 characters.';
      errBox.classList.remove('hidden');
      return;
    }
    if (!TOKEN) {
      errBox.textContent = 'Reset token is missing. Please request a new reset link.';
      errBox.classList.remove('hidden');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Updating…';

    try {
      const res  = await fetch('/auth/reset-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token: TOKEN, password }),
      });
      const data = await res.json();

      if (res.ok) {
        document.getElementById('form-state').classList.add('hidden');
        document.getElementById('success-state').classList.remove('hidden');
        setTimeout(() => window.location.href = '/auth/login-page', 2200);
      } else {
        errBox.textContent = data?.error?.message ?? `Error ${res.status}`;
        errBox.classList.remove('hidden');
        btn.disabled    = false;
        btn.textContent = 'Update password';
      }
    } catch (err) {
      errBox.textContent = `Network error: ${err.message}`;
      errBox.classList.remove('hidden');
      btn.disabled    = false;
      btn.textContent = 'Update password';
    }
  }
</script>
</body>
</html>
